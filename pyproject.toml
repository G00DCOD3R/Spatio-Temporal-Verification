[tool.poetry]
name = "spatio-temporal-verification"
version = "0.1.0"
description = "Spatio-temporal verification for neural networks"
authors = ["Your Name <your.email@example.com>"]

[tool.poetry.dependencies]
python = "^3.8"
torch = "2.1.2"
torchvision = "^0.16.2"
numpy = "^1.24.0"
matplotlib = "^3.7.0"
pandas = "^2.0.0"
scikit-learn = "^1.0.0"
gurobipy = "^10.0.0"  # For MILP verification
tqdm = "^4.65.0"
seaborn = "^0.12.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
black = "^23.0.0"
isort = "^5.12.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api" 